<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HBntory — Assistant produits</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Superpositions décoratives : pluie numérique et lignes de balayage -->
    <canvas id="matrix" aria-hidden="true"></canvas>
    <div class="fx-scanlines" aria-hidden="true"></div>

    <main class="app">
        <!-- Barre d'état décorative en haut du panneau -->
        <div class="statusbar" aria-hidden="true">
            <span class="statusbar-dot"></span>
            <span>SYSTEM ONLINE</span>
            <span class="statusbar-tag">HBNTORY // C-29</span>
        </div>

        <h1 class="glitch" data-text="ASSISTANT PRODUITS">
            ASSISTANT PRODUITS
        </h1>

        <p class="intro">
            Posez une question sur les produits et leur disponibilité.
        </p>

        <!-- Formulaire de saisie de la question -->
        <form id="question-form" class="question-form">
            <label for="question" class="sr-only">
                Votre question
            </label>

            <input
                type="text"
                id="question"
                name="question"
                class="question-input"
                placeholder="> Où puis-je trouver un laptop ?"
                autocomplete="off"
                required
            >

            <button type="submit" id="submit-button" class="submit-button">
                Envoyer
            </button>
        </form>

        <!-- Indicateur de chargement, masqué par défaut -->
        <p id="loading" class="loading" hidden>
            // ANALYSE EN COURS<span class="loading-dots"></span>
        </p>

        <!-- Zone d'affichage de la réponse, remplie par le script -->
        <section
            id="answer"
            class="answer"
            aria-live="polite"
            hidden
        ></section>

        <!-- Zone d'affichage des erreurs, remplie par le script -->
        <p
            id="error"
            class="error"
            role="alert"
            hidden
        ></p>
    </main>

    <script src="background.js"></script>
    <script src="script.js"></script>
</body>
</html>
