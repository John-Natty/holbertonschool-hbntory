name: hbntory-tests

services:
  test-database:
    image: postgres:16
    environment:
      POSTGRES_DB: hbntory_test
      POSTGRES_USER: hbntory_test_user
      POSTGRES_PASSWORD: hbntory_test_password
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U hbntory_test_user -d hbntory_test
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 3s

  backoffice-tests:
    build:
      context: ./backoffice
      dockerfile: Dockerfile.test
    environment:
      DATABASE_URL: >-
        postgresql://hbntory_test_user:hbntory_test_password@test-database:5432/hbntory_test
      TEST_DATABASE_URL: >-
        postgresql://hbntory_test_user:hbntory_test_password@test-database:5432/hbntory_test
      SECRET_KEY: test-secret-key-with-at-least-32-characters
      INTERNAL_API_KEY: test-internal-key-with-at-least-32-characters
      PRODUCT_API_BASE_URL: http://product-api.invalid
    depends_on:
      test-database:
        condition: service_healthy
    command:
      - sh
      - -c
      - >-
        python -m flask --app app:create_app db upgrade &&
        python -m pytest -v -p no:cacheprovider
