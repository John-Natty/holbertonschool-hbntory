services:
  product-api:
    # Image fournie par l'énoncé (API Produit en lecture seule).
    # Remplacer la valeur par l'image réelle indiquée dans la Task.
    image: ${PRODUCT_API_IMAGE:-holberton/product-api:latest}
    ports:
      - "${PRODUCT_API_PORT:-8000}:8000"
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped

