services:
  external-products-api:
    # API Produit officielle, construite depuis son dépôt Git.
    build:
      context: https://github.com/hbtn-edu/hbntory-products-api.git
    ports:
      # Port ordinateur : port interne du conteneur
      - "${PRODUCT_API_PORT:-5001}:5000"
    restart: unless-stopped

  database:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - database_data:/var/lib/postgresql/data
    restart: unless-stopped

